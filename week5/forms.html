<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Review</title>
<meta name="description" content="Submit a product review including rating, features, and feedback to help others make better decisions.">
<meta name="author" content="Prominence Ncube">

<link rel="stylesheet" href="styles/forms.css">
<script defer src="scripts/forms.js"></script>
</head>

<body>

<header>
    <h1>Product Review Form</h1>
</header>

<main>
<form method="get" action="review.html">

    <!-- Product Name -->
    <label for="product">Product Name</label>
    <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
    </select>

    <!-- Rating -->
   <fieldset>
        <legend>Overall Rating</legend>

        <input type="radio" id="rate1" name="rating" value="1" required>
        <label for="rate1">☆</label>

        <input type="radio" id="rate2" name="rating" value="2" required>
        <label for="rate2">☆☆</label>

        <input type="radio" id="rate3" name="rating" value="3" required>
        <label for="rate3">☆☆☆</label>

        <input type="radio" id="rate4" name="rating" value="4" required>
        <label for="rate4">☆☆☆☆</label>

        <input type="radio" id="rate5" name="rating" value="5" required>
        <label for="rate5">☆☆☆☆☆</label>

</fieldset>

    <!-- Date -->
    <label for="date">Date of Installation</label>
    <input type="date" id="date" name="date" required>

    <!-- Features -->
   <fieldset>
        <legend>Useful Features</legend>

        <input type="checkbox" id="durable" name="features" value="durable">
        <label for="durable">Durable</label>

        <input type="checkbox" id="easy" name="features" value="easy">
        <label for="easy">Easy to Use</label>

        <input type="checkbox" id="affordable" name="features" value="affordable">
        <label for="affordable">Affordable</label>

        <input type="checkbox" id="design" name="features" value="design">
        <label for="design">Good Design</label>
2
</fieldset>

    <!-- Review -->
    <label for="review">Written Review</label>
    <textarea id="review" name="review"></textarea>

    <!-- Username -->
    <label for="username">Your Name</label>
    <input type="text" id="username" name="username">

    <!-- Submit -->
    <input type="submit" value="Submit Review">

</form>
</main>

<footer>
    <p>&copy; 2026 | Prominence Ncube | Product Review</p>
</footer>

</body>
</html>
